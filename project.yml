name: LanierProperties
options:
  bundleIdPrefix: net.lanierproperties
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(LANIER_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # `targeted` rather than `complete`: URLSession and several MapKit types
    # still trip complete checking, and the noise would bury real diagnostics on
    # the first build. Tighten to `complete` once the project compiles cleanly.
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

configs:
  Debug: debug
  Release: release

targets:
  LanierProperties:
    type: application
    platform: iOS
    # iPhone only. Apple accepts iPhone-only submissions; see docs/APP_STORE_CHECKLIST.md.
    deploymentTarget: "17.0"
    sources:
      - path: LanierProperties
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lanierproperties.app
        PRODUCT_NAME: Lanier Properties
        # Display name has a space; pin the Swift module name so tests can
        # `@testable import LanierProperties` rather than `Lanier_Properties`.
        PRODUCT_MODULE_NAME: LanierProperties
        INFOPLIST_FILE: LanierProperties/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
      debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig

  LanierPropertiesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LanierPropertiesTests
    dependencies:
      - target: LanierProperties
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lanierproperties.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LanierProperties:
    build:
      targets:
        LanierProperties: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LanierPropertiesTests
    archive:
      config: Release
